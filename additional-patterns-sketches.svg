<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Caveat','Comic Sans MS','Bradley Hand',cursive" font-size="22">
  <defs>
    <filter id="rough" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="720">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .stroke { stroke: #222; stroke-width: 2; fill: none; filter: url(#rough); stroke-linecap: round; }
    .dashed { stroke: #222; stroke-width: 2; fill: none; filter: url(#rough); stroke-linecap: round; stroke-dasharray: 6 5; }
    .node { fill: #fffdf6; stroke: #222; stroke-width: 2; filter: url(#rough); }
    .ledger { fill: #f4efe0; stroke: #222; stroke-width: 2; filter: url(#rough); }
    .title { font-size: 26px; }
    .sub { font-size: 17px; fill: #555; }
    text { fill: #222; }
  </style>

  <!-- Panel 1: Hierarchical (tree) -->
  <g transform="translate(0,0)">
    <text x="200" y="40" text-anchor="middle" class="title">Hierarchical Tree</text>
    <text x="200" y="62" text-anchor="middle" class="sub">supervisor of supervisors</text>
    <circle cx="200" cy="115" r="30" class="node"/>
    <text x="200" y="121" text-anchor="middle">S</text>
    <circle cx="110" cy="215" r="26" class="node"/>
    <text x="110" y="222" text-anchor="middle">s1</text>
    <circle cx="290" cy="215" r="26" class="node"/>
    <text x="290" y="222" text-anchor="middle">s2</text>
    <circle cx="55" cy="310" r="20" class="node"/>
    <text x="55" y="316" text-anchor="middle">w</text>
    <circle cx="110" cy="310" r="20" class="node"/>
    <text x="110" y="316" text-anchor="middle">w</text>
    <circle cx="165" cy="310" r="20" class="node"/>
    <text x="165" y="316" text-anchor="middle">w</text>
    <circle cx="235" cy="310" r="20" class="node"/>
    <text x="235" y="316" text-anchor="middle">w</text>
    <circle cx="290" cy="310" r="20" class="node"/>
    <text x="290" y="316" text-anchor="middle">w</text>
    <circle cx="345" cy="310" r="20" class="node"/>
    <text x="345" y="316" text-anchor="middle">w</text>
    <line x1="184" y1="142" x2="120" y2="192" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="216" y1="142" x2="280" y2="192" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="98" y1="240" x2="60" y2="290" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="110" y1="241" x2="110" y2="290" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="122" y1="240" x2="160" y2="290" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="278" y1="240" x2="240" y2="290" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="290" y1="241" x2="290" y2="290" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="302" y1="240" x2="340" y2="290" class="stroke" marker-end="url(#arrow2)"/>
  </g>

  <!-- Panel 2: Network / Peer-to-peer -->
  <g transform="translate(400,0)">
    <text x="200" y="40" text-anchor="middle" class="title">Network (Peer-to-Peer)</text>
    <text x="200" y="62" text-anchor="middle" class="sub">any-to-any · no coordinator</text>
    <circle cx="200" cy="130" r="26" class="node"/>
    <text x="200" y="137" text-anchor="middle">A</text>
    <circle cx="320" cy="220" r="26" class="node"/>
    <text x="320" y="227" text-anchor="middle">B</text>
    <circle cx="270" cy="320" r="26" class="node"/>
    <text x="270" y="327" text-anchor="middle">C</text>
    <circle cx="130" cy="320" r="26" class="node"/>
    <text x="130" y="327" text-anchor="middle">D</text>
    <circle cx="80" cy="220" r="26" class="node"/>
    <text x="80" y="227" text-anchor="middle">E</text>
    <line x1="220" y1="148" x2="305" y2="205" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="305" y1="240" x2="285" y2="298" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="245" y1="320" x2="155" y2="320" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="115" y1="298" x2="95" y2="240" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="95" y1="205" x2="180" y2="148" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="106" y1="220" x2="294" y2="220" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="200" y1="156" x2="270" y2="294" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="200" y1="156" x2="130" y2="294" class="stroke" marker-end="url(#arrow2)"/>
  </g>

  <!-- Panel 3: Manager / Agents-as-Tools -->
  <g transform="translate(800,0)">
    <text x="200" y="40" text-anchor="middle" class="title">Manager (Agents-as-Tools)</text>
    <text x="200" y="62" text-anchor="middle" class="sub">root keeps control · subs are tools</text>
    <circle cx="200" cy="220" r="40" class="node"/>
    <text x="200" y="227" text-anchor="middle">root</text>
    <rect x="40" y="125" width="74" height="44" class="node" rx="6"/>
    <text x="77" y="153" text-anchor="middle">tool a</text>
    <rect x="290" y="125" width="74" height="44" class="node" rx="6"/>
    <text x="327" y="153" text-anchor="middle">tool b</text>
    <rect x="40" y="275" width="74" height="44" class="node" rx="6"/>
    <text x="77" y="303" text-anchor="middle">tool c</text>
    <rect x="290" y="275" width="74" height="44" class="node" rx="6"/>
    <text x="327" y="303" text-anchor="middle">tool d</text>
    <line x1="170" y1="200" x2="115" y2="160" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="118" y1="155" x2="170" y2="208" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="230" y1="200" x2="285" y2="160" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="282" y1="155" x2="230" y2="208" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="170" y1="240" x2="115" y2="280" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="118" y1="285" x2="170" y2="232" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="230" y1="240" x2="285" y2="280" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="282" y1="285" x2="230" y2="232" class="stroke" marker-end="url(#arrow2)"/>
  </g>

  <!-- Panel 4: Magentic-One dual-loop -->
  <g transform="translate(0,360)">
    <text x="200" y="40" text-anchor="middle" class="title">Magentic-One Dual-Loop</text>
    <text x="200" y="62" text-anchor="middle" class="sub">task ledger · progress ledger</text>
    <rect x="30" y="105" width="150" height="60" class="ledger" rx="6"/>
    <text x="105" y="130" text-anchor="middle" class="sub">task ledger</text>
    <text x="105" y="152" text-anchor="middle" class="sub">facts · plan</text>
    <rect x="220" y="105" width="150" height="60" class="ledger" rx="6"/>
    <text x="295" y="130" text-anchor="middle" class="sub">progress ledger</text>
    <text x="295" y="152" text-anchor="middle" class="sub">step status</text>
    <circle cx="200" cy="225" r="34" class="node"/>
    <text x="200" y="232" text-anchor="middle">orch</text>
    <circle cx="90" cy="320" r="22" class="node"/>
    <text x="90" y="327" text-anchor="middle">w</text>
    <circle cx="200" cy="320" r="22" class="node"/>
    <text x="200" y="327" text-anchor="middle">w</text>
    <circle cx="310" cy="320" r="22" class="node"/>
    <text x="310" y="327" text-anchor="middle">w</text>
    <line x1="105" y1="170" x2="180" y2="200" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="220" y1="200" x2="295" y2="170" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="180" y1="200" x2="105" y2="170" class="dashed" marker-end="url(#arrow2)"/>
    <line x1="295" y1="170" x2="220" y2="200" class="dashed" marker-end="url(#arrow2)"/>
    <line x1="180" y1="248" x2="100" y2="298" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="200" y1="259" x2="200" y2="298" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="220" y1="248" x2="300" y2="298" class="stroke" marker-end="url(#arrow2)"/>
    <text x="200" y="100" text-anchor="middle" class="sub">re-plan when stuck</text>
  </g>

  <!-- Panel 5: Blackboard -->
  <g transform="translate(400,360)">
    <text x="200" y="40" text-anchor="middle" class="title">Blackboard</text>
    <text x="200" y="62" text-anchor="middle" class="sub">shared memory · read/write</text>
    <rect x="100" y="180" width="200" height="80" class="ledger" rx="6"/>
    <text x="200" y="215" text-anchor="middle">blackboard</text>
    <text x="200" y="240" text-anchor="middle" class="sub">shared state</text>
    <circle cx="60" cy="120" r="22" class="node"/>
    <text x="60" y="127" text-anchor="middle">A</text>
    <circle cx="340" cy="120" r="22" class="node"/>
    <text x="340" y="127" text-anchor="middle">B</text>
    <circle cx="60" cy="320" r="22" class="node"/>
    <text x="60" y="327" text-anchor="middle">C</text>
    <circle cx="340" cy="320" r="22" class="node"/>
    <text x="340" y="327" text-anchor="middle">D</text>
    <line x1="78" y1="138" x2="115" y2="180" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="112" y1="183" x2="75" y2="142" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="322" y1="138" x2="285" y2="180" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="288" y1="183" x2="325" y2="142" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="78" y1="302" x2="115" y2="260" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="112" y1="257" x2="75" y2="298" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="322" y1="302" x2="285" y2="260" class="stroke" marker-end="url(#arrow2)"/>
    <line x1="288" y1="257" x2="325" y2="298" class="stroke" marker-end="url(#arrow2)"/>
  </g>

  <!-- Panel 6: Debate / Competitive -->
  <g transform="translate(800,360)">
    <text x="200" y="40" text-anchor="middle" class="title">Debate</text>
    <text x="200" y="62" text-anchor="middle" class="sub">opposing agents · judge decides</text>
    <circle cx="200" cy="125" r="32" class="node"/>
    <text x="200" y="132" text-anchor="middle">judge</text>
    <circle cx="100" cy="260" r="34" class="node"/>
    <text x="100" y="267" text-anchor="middle">pro</text>
    <circle cx="300" cy="260" r="34" class="node"/>
    <text x="300" y="267" text-anchor="middle">con</text>
    <path d="M138,250 Q200,210 262,250" class="stroke" marker-end="url(#arrow2)"/>
    <path d="M262,275 Q200,315 138,275" class="stroke" marker-end="url(#arrow2)"/>
    <text x="200" y="220" text-anchor="middle" class="sub">argue</text>
    <text x="200" y="320" text-anchor="middle" class="sub">rebut</text>
    <line x1="115" y1="232" x2="180" y2="155" class="dashed" marker-end="url(#arrow2)"/>
    <line x1="285" y1="232" x2="220" y2="155" class="dashed" marker-end="url(#arrow2)"/>
  </g>
</svg>
